{%- comment -%}
  YouTube video: shows YouTube's thumbnail and loads the player only when
  pressed (faster pages, no YouTube cookies until then). Param: video
{%- endcomment -%}
{%- assign v = include.video -%}
{%- capture external_link_icon -%}<svg viewBox="0 0 24 24" width="15.5" height="15.5" style="vertical-align: -2px" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>{%- endcapture -%}
<figure class="video">
  <button class="video__poster" type="button" data-youtube="{{ v.youtube_id }}" aria-label="Play video: {{ v.title }}">
    <img src="https://i.ytimg.com/vi/{{ v.youtube_id }}/hqdefault.jpg" alt="" loading="lazy" decoding="async">
    <span class="video__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
  </button>
  <figcaption class="video__caption">
    {{ v.title }}
    <a href="https://www.youtube.com/watch?v={{ v.youtube_id }}" target="_blank" rel="noopener">Watch on YouTube {{ external_link_icon }}</a>
  </figcaption>
</figure>
