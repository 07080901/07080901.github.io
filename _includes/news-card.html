{%- assign p = include.post -%}
<article class="card">
  <a class="card__img" href="{{ p.url | relative_url }}" tabindex="-1" aria-hidden="true">
    <img src="{{ p.image | default: '/assets/img/news/news-1.svg' | relative_url }}" alt="" loading="lazy">
  </a>
  <div class="card__body">
    <time class="card__date" datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%B %-d, %Y" }}</time>
    <h3 class="card__title"><a href="{{ p.url | relative_url }}">{{ p.title | truncate: 60 }}</a></h3>
  </div>
</article>
