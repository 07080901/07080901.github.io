{%- comment -%} Icons for the links in _config.yml → social (shown in that order). {%- endcomment -%}
<ul class="social" role="list">
{%- for s in site.social -%}
  {%- if s.url != "" -%}
  <li><a class="platform--{{ s.name | slugify }}" href="{{ s.url }}" target="_blank" rel="noopener" aria-label="{{ s.name }}">{%- include icon.html name=s.name -%}</a></li>
  {%- endif -%}
{%- endfor -%}
</ul>
