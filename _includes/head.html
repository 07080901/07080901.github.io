<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070c14">
  <script>document.documentElement.classList.remove('no-js');</script>
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  {%- seo title=false -%}
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- if page.layout == 'home' %}
  {%- assign home = site.pages | where: "section", "home" | first -%}
  {%- if home.hero_image %}
  <link rel="preload" href="{{ home.hero_image | relative_url }}" as="image" fetchpriority="high">
  {%- endif %}
  {%- if site.intro.enabled and page.section == "home" %}
  <link rel="preload" href="{{ site.logo | relative_url }}" as="image">
  <script>
    /* decide before first paint whether the intro plays, so it never flashes */
    (function () {
      var d = document.documentElement, play = true;
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) play = false;
        {%- if site.intro.once_per_session %}
        if (sessionStorage.getItem('introSeen')) play = false;
        {%- endif %}
      } catch (e) {}
      d.classList.add(play ? 'intro-play' : 'intro-skip');
    })();
  </script>
  {%- endif %}
  {%- endif %}
</head>
