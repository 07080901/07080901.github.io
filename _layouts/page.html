---
layout: default
---
<header class="page-hero{% if page.hero %} page-hero--image{% endif %}"{% if page.hero %} style="--img: url('{{ page.hero | relative_url }}')"{% endif %}>
  <h1 class="display page-hero__title">{{ page.title }}</h1>
  {%- if page.subtitle %}<p class="page-hero__sub">{{ page.subtitle }}</p>{% endif -%}
</header>
<div class="page-body{% if page.wide %} page-body--wide{% endif %}">
  {{ content }}
</div>
