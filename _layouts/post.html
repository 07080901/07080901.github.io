---
layout: default
---
<article class="post">
  <header class="post__head">
    <a class="link-arrow link-arrow--back" href="{{ '/news/' | relative_url }}">All news</a>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1 class="display">{{ page.title }}</h1>
  </header>
  {%- if page.image -%}
  <img class="post__image" src="{{ page.image | relative_url }}" alt="">
  {%- endif -%}
  <div class="post__body prose">
    {{ content }}
  </div>
  <nav class="post__pager">
    {%- if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title | truncate: 40 }}</a>{% else %}<span></span>{% endif -%}
    {%- if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title | truncate: 40 }} &rarr;</a>{% endif -%}
  </nav>
</article>
