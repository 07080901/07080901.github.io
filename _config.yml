# ============================================================
#  BEN — site settings
#  Edit this file first. Restart `jekyll serve` after changes.
# ============================================================

title: "Ben"                         # short name, used in the logo + browser tab
artist_name: "Andrea Benini"         # full name, used in footer / SEO
description: "Andrea “Ben” Benini — blues, funk & punk guitarist."
lang: en
logo_text: "Ben"                     # text drawn in the intro + header logo
logo_image: ""                       # optional: /assets/img/logo.svg replaces the text logo
tagline: "Blues · Funk · Punk"

# --- GitHub Pages URL ----------------------------------------
# Repo named <username>.github.io  -> baseurl: ""
# Any other repo name, e.g. "ben"  -> baseurl: "/ben"
url: "https://07080901.github.io"
baseurl: ""

# --- Intro animation ------------------------------------------
intro:
  enabled: true
  once_per_session: true             # false = play on every home-page load
  subtitle: "Blues · Funk · Punk"

# --- Navigation (order = order in header) ---------------------
nav:
  - title: About
    url: /about/
  - title: Timeline
    url: /timeline/
  - title: Tour
    url: /tour/
  - title: News
    url: /news/
  - title: Music
    url: /music/
  - title: Videos
    url: /videos/
  - title: Shop
    url: https://example.com/shop     # external links open in a new tab
    external: true

# --- Social links (leave "" to hide an icon) -------------------
social:
  instagram: "https://instagram.com/"
  youtube: "https://youtube.com/"
  spotify: "https://open.spotify.com/"
  bandcamp: "https://bandcamp.com/"
  facebook: ""
  x: ""
  tiktok: ""

# --- Mailing list ---------------------------------------------
# Paste the form "action" URL from Mailchimp / Buttondown / Formspree / Brevo.
# Leave "" and the form shows but tells visitors it's coming soon.
mailing_list:
  action: ""
  email_field_name: "email"          # Mailchimp uses "EMAIL"
  heading: "Join the mailing list"
  text: "New songs, shows and the occasional broken string. No spam."

# --- Home page section headings -------------------------------
home:
  timeline_heading: "Explore the story so far"
  timeline_button: "View the timeline"
  news_heading: "News"
  tour_heading: "Tour Dates"
  tour_limit: 5
  video_heading: "Turn it up"
  video_button: "Watch more videos"
  shop_heading: "Shop"
  shop_enabled: true

footer_links:
  - title: Terms of Use
    url: /terms/
  - title: Privacy Policy
    url: /privacy/

# --- Build settings (no need to touch) ------------------------
permalink: /news/:year/:month/:day/:title/
timezone: Europe/Rome
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Image shown when the site is shared on WhatsApp / Instagram / Facebook / X.
# Replace assets/img/og-image.jpg (1200x630 JPG or PNG) with your own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.jpg
twitter:
  card: summary_large_image
sass:
  style: compressed
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE.txt
  - vendor
  - .bundle
